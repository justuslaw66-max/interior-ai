# DIAGNOSTIC ONLY (branch diagnostic/cabinet-preview-webkit-blank, never merged).
# Reproduces the flaky WebKit "keeps all recommended Cabinet Preview templates
# readable" test by repeating the real required spec, once per candidate fix:
#   baseline         - current code (frameloop "always")
#   preserve         - preserveDrawingBuffer: true
#   demand           - frameloop="demand"
#   demand-preserve  - frameloop="demand" + preserveDrawingBuffer: true
# Run 3 showed baseline 0/100, preserve 0/100, demand 4/100 failing, so this
# run uses "demand" as the reproducing control and tests whether a preserved
# drawing buffer removes those blank captures (two shards of the treatment).
# Same runner, services and build env as ci.yml's Stable checks job.
name: Cabinet Preview WebKit capture diagnostic

on:
  push:
    branches: [diagnostic/cabinet-preview-webkit-blank]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: repro (${{ matrix.variant }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: demand
            shard: 1
          - variant: demand-preserve
            shard: 1
          - variant: demand-preserve
            shard: 2
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: interior_ai_test
        options: >-
          --health-cmd "pg_isready -U test -d interior_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      CI: "true"
      CI_AUTH_FIXTURE_MODE: "1"
      CI_AUTH_FIXTURE_SESSION_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.variant }}-${{ matrix.shard }}-auth-session
      CI_AUTH_FIXTURE_SESSION_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.variant }}-${{ matrix.shard }}-auth-nonce
      CI_AUTH_FIXTURE_SESSION_CLASSIFICATION: PRODUCTION_INELIGIBLE_SYNTHETIC_AUTH
      APP_ENV: development
      DATABASE_URL: postgresql://test:test@localhost:5432/interior_ai_test
      AUTH_SECRET: ci-only-auth-secret-at-least-32-characters
      NEXTAUTH_SECRET: ci-only-auth-secret-at-least-32-characters
      NEXTAUTH_URL: http://127.0.0.1:3000
      APP_ORIGIN: http://127.0.0.1:3000
      AUTH_TRUST_HOST: "true"
      ADMIN_EMAILS: gate-a3-admin@example.test
      PLAYWRIGHT_ADMIN_EMAIL: gate-a3-admin@example.test
      OPENAI_API_KEY: gate-a3-ci-openai-placeholder
      SHOPIFY_STORE_DOMAIN: gate-a3-ci.myshopify.com
      SHOPIFY_STOREFRONT_TOKEN: gate-a3-ci-shopify-placeholder
      POSTHOG_KEY: gate-a3-ci-posthog-placeholder
      STRIPE_SECRET_KEY: sk_test_gate_a3_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_gate_a3_ci_placeholder
      STRIPE_PRICE_PRO_MONTHLY: price_gate_a3_ci_monthly
      STRIPE_PRICE_PRO_YEARLY: price_gate_a3_ci_yearly
      REPEATS: "100"
    steps:
      - name: Initialize runner-local auth fixture paths
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "CI_AUTH_FIXTURE_RESULT_ROOT=$RUNNER_TEMP/interior-ai-auth-results" >> "$GITHUB_ENV"
          printf '%s\n' "CI_AUTH_FIXTURE_SESSION_ROOT=$RUNNER_TEMP/interior-ai-auth-session-diag" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure synthetic CI OAuth fixture
        env:
          CI_AUTH_FIXTURE_RESULT_PATH: ${{ runner.temp }}/interior-ai-auth-results/diag-export.json
          CI_AUTH_FIXTURE_RESULT_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.variant }}-${{ matrix.shard }}-export
          CI_AUTH_FIXTURE_EXPECTED_COMMAND_ID: ci:auth-fixture:export
          CI_AUTH_FIXTURE_EXPECTED_MODE: provider-fixture-export
        run: |
          mkdir -p "$CI_AUTH_FIXTURE_RESULT_ROOT"
          export CI_AUTH_FIXTURE_CANDIDATE_COMMIT_SHA="$(git rev-parse HEAD)"
          export CI_AUTH_FIXTURE_CANDIDATE_TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          npm run ci:auth-fixture:export

      - name: Apply database migrations
        env:
          GATE_A3_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npm run gate:a3:db

      - name: Build (staging env, variant ${{ matrix.variant }})
        env:
          APP_ENV: staging
          NEXT_PUBLIC_APP_ENV: staging
          CATALOG_STRICT_VALIDATION: "true"
          NODE_ENV: production
          NEXT_PUBLIC_CABINET_PREVIEW_DIAG_VARIANT: ${{ matrix.variant }}
        run: npm run build

      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit

      - name: Minimal WebGL capture check
        if: false
        continue-on-error: true
        run: npx playwright test --config=playwright.cabinet-preview-minimal.config.ts

      - name: Repeat the required Cabinet Preview test (${{ env.REPEATS }}x)
        continue-on-error: true
        env:
          APP_ENV: staging
          CATALOG_STRICT_VALIDATION: "true"
        run: >-
          npx playwright test --config=playwright.cabinet-preview-repro.config.ts
          --grep "keeps all recommended Cabinet Preview templates readable"
          --repeat-each=${{ env.REPEATS }}

      - name: Summarize
        if: always()
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }} shard ${{ matrix.shard }}
        run: |
          node -e '
            const fs = require("fs");
            const file = "test-results/cabinet-preview-repro/report.json";
            if (!fs.existsSync(file)) { console.log("no report"); process.exit(0); }
            const report = JSON.parse(fs.readFileSync(file, "utf8"));
            const results = [];
            const walk = (suite) => {
              for (const spec of suite.specs ?? []) for (const t of spec.tests) for (const r of t.results) results.push(r);
              for (const child of suite.suites ?? []) walk(child);
            };
            for (const suite of report.suites) walk(suite);
            const counts = {};
            for (const r of results) counts[r.status] = (counts[r.status] ?? 0) + 1;
            const failures = results.map((r, index) => ({ r, index })).filter(({ r }) => r.status !== "passed" && r.status !== "skipped").map(({ r, index }) => {
              const message = (r.error?.message ?? r.errors?.[0]?.message ?? "").replace(/\u001b\[[0-9;]*m/g, "");
              const label = (message.match(/Error: (.*?) should contain rendered geometry/) ?? message.match(/Error: ([^\n]*)/) ?? [])[1] ?? "?";
              const received = (message.match(/Received:\s+([\d.e-]+)/) ?? [])[1] ?? "";
              return `run ${index + 1}: ${label} ${received} (${Math.round(r.duration / 1000)}s)`;
            });
            const durations = results.map(r => r.duration / 1000).sort((a, b) => a - b);
            const median = durations[Math.floor(durations.length / 2)] ?? 0;
            const out = [
              `## Cabinet Preview repro — variant \`${process.env.VARIANT}\``,
              "",
              `runs: ${results.length}, ${Object.entries(counts).map(([k, v]) => `${k}: ${v}`).join(", ")}, median duration ${median.toFixed(1)}s`,
              "",
              ...failures.map(f => `- ${f}`),
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n") + "\n");
            console.log(out.join("\n"));
          '

      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cabinet-preview-repro-${{ matrix.variant }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/cabinet-preview-repro/
            test-results/cabinet-preview-minimal/
          if-no-files-found: warn
          retention-days: 14
