name: WINDOW bounded rendering attribution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  window-linux-comparison:
    if: github.ref == 'refs/heads/diagnostic/window-idle-linux-d5deaba-87ba770' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD_FILE: /proc/sys/kernel/random/boot_id
        options: >-
          --log-driver none
          --health-cmd "pg_isready -U test -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
      - name: Execute the approved serial comparison with private capture
        id: comparison
        env:
          WINDOW_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node .github/diagnostics/window-linux/campaign.mjs > "$RUNNER_TEMP/window-linux-driver.raw" 2>&1
      - name: Check sanitized artifact seal
        id: seal
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/window-linux-standing-r1-02/upload-ready" ]; then
            node .github/diagnostics/window-linux/verify-upload.mjs > "$RUNNER_TEMP/window-linux-upload-verification.raw" 2>&1
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Retain the single sanitized diagnostic artifact
        if: always() && steps.seal.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: window-linux-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/window-linux-standing-r1-02/sanitized/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
