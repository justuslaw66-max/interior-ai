name: CI - Test & Build

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  stable-checks:
    name: Stable checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: interior_ai_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      CI: "true"
      APP_ENV: development
      DATABASE_URL: postgresql://test:test@localhost:5432/interior_ai_test
      AUTH_SECRET: ci-only-auth-secret-at-least-32-characters
      NEXTAUTH_SECRET: ci-only-auth-secret-at-least-32-characters
      NEXTAUTH_URL: http://127.0.0.1:3000
      APP_ORIGIN: http://127.0.0.1:3000
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: 123456789012-gate-a3-ci.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: GOCSPX-gate-a3-ci-placeholder
      ADMIN_EMAILS: gate-a3-admin@example.test
      PLAYWRIGHT_ADMIN_EMAIL: gate-a3-admin@example.test
      OPENAI_API_KEY: gate-a3-ci-openai-placeholder
      SHOPIFY_STORE_DOMAIN: gate-a3-ci.myshopify.com
      SHOPIFY_STOREFRONT_TOKEN: gate-a3-ci-shopify-placeholder
      POSTHOG_KEY: gate-a3-ci-posthog-placeholder
      STRIPE_SECRET_KEY: sk_test_gate_a3_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_gate_a3_ci_placeholder
      STRIPE_PRICE_PRO_MONTHLY: price_gate_a3_ci_monthly
      STRIPE_PRICE_PRO_YEARLY: price_gate_a3_ci_yearly
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce code-quality ratchets
        env:
          CODE_QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run check:code-quality

      - name: Verify production artifact evidence contract
        run: npm run test:production-artifact-evidence

      - name: Build strict production-equivalent artifact evidence
        env:
          APP_ENV: staging
          CATALOG_STRICT_VALIDATION: "true"
          PRODUCTION_EVIDENCE_CANDIDATE_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run evidence:production:build

      - name: Install Playwright Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run runtime smoke tests
        run: npm run evidence:production:smoke

      - name: Verify fail-closed authentication and admin environment policy
        run: npm run test:auth-env-hardening

      - name: Apply database migrations
        env:
          GATE_A3_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npm run gate:a3:db

      - name: Lint (zero warnings)
        run: npm run lint -- --max-warnings=0

      - name: Verify design-page cleanup guards
        run: npm run test:design-page-cleanup

      - name: Typecheck
        run: npm run typecheck

      - name: Verify complete floor-plan platform
        timeout-minutes: 20
        run: npm run test:floor-plan-required

      - name: Verify Pro visual and Cabinet Preview policies
        run: npm run test:designer-theme-contrast && npm run test:cabinetry-preview-renderer

      - name: Verify asset inventory
        run: npm run assets:inventory:strict

      - name: Audit catalog quality
        run: npm run test:catalog-audit

      - name: Audit catalog asset availability
        run: npm run test:catalog-asset-availability

      - name: Run Pro visual policy matrix
        env:
          APP_ENV: staging
          CATALOG_STRICT_VALIDATION: "true"
          PLAYWRIGHT_USE_PRODUCTION_SERVER: "1"
        run: npm run test:pro-visual-policy

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-results
          path: |
            .local/production-artifact-evidence/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  e2e-full:
    name: Full E2E (informational)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    needs: stable-checks
    continue-on-error: true
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: interior_ai_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      CI: "true"
      APP_ENV: development
      DATABASE_URL: postgresql://test:test@localhost:5432/interior_ai_test
      AUTH_SECRET: ci-only-auth-secret-at-least-32-characters
      NEXTAUTH_SECRET: ci-only-auth-secret-at-least-32-characters
      NEXTAUTH_URL: http://127.0.0.1:3000
      APP_ORIGIN: http://127.0.0.1:3000
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: 123456789012-gate-a3-ci.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: gate-a3-ci-google-client-secret-placeholder
      ADMIN_EMAILS: gate-a3-admin@example.test
      PLAYWRIGHT_ADMIN_EMAIL: gate-a3-admin@example.test
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        env:
          GATE_A3_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npm run gate:a3:db

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30

  merge-gate:
    name: Merge gate
    runs-on: ubuntu-latest
    needs: [secret-scan, stable-checks]
    if: always()
    steps:
      - name: Check required results
        env:
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          STABLE_CHECKS_RESULT: ${{ needs.stable-checks.result }}
        run: |
          if [ "$SECRET_SCAN_RESULT" != "success" ] || [ "$STABLE_CHECKS_RESULT" != "success" ]; then
            echo "Required CI checks failed"
            exit 1
          fi
          echo "Required CI checks passed"
