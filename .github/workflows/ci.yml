name: CI - Test & Build

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  stable-checks:
    name: Stable checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: interior_ai_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      CI: "true"
      DATABASE_URL: postgresql://test:test@localhost:5432/interior_ai_test
      AUTH_SECRET: ci-only-auth-secret-at-least-32-characters
      NEXTAUTH_SECRET: ci-only-auth-secret-at-least-32-characters
      NEXTAUTH_URL: http://127.0.0.1:3000
      APP_ORIGIN: http://127.0.0.1:3000
      CATALOG_STRICT_VALIDATION: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Lint (zero warnings)
        run: npm run lint -- --max-warnings=0

      - name: Verify design-page cleanup guards
        run: npm run test:design-page-cleanup

      - name: Typecheck
        run: npm run typecheck

      - name: Verify complete floor-plan platform
        timeout-minutes: 20
        run: npm run test:floor-plan-required

      - name: Verify Pro visual and Cabinet Preview policies
        run: npm run test:designer-theme-contrast && npm run test:cabinetry-preview-renderer

      - name: Verify asset inventory
        run: npm run assets:inventory:strict

      - name: Audit catalog quality
        run: npm run test:catalog-audit

      - name: Audit catalog asset availability
        run: npm run test:catalog-asset-availability

      - name: Build production application
        run: npm run build

      - name: Install Playwright Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run runtime smoke tests
        run: npm run test:e2e:smoke

      - name: Run Pro visual policy matrix
        env:
          PLAYWRIGHT_USE_PRODUCTION_SERVER: "1"
        run: npm run test:pro-visual-policy

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  e2e-full:
    name: Full E2E (informational)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    needs: stable-checks
    continue-on-error: true
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: interior_ai_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      CI: "true"
      DATABASE_URL: postgresql://test:test@localhost:5432/interior_ai_test
      AUTH_SECRET: ci-only-auth-secret-at-least-32-characters
      NEXTAUTH_SECRET: ci-only-auth-secret-at-least-32-characters
      NEXTAUTH_URL: http://127.0.0.1:3000
      APP_ORIGIN: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30

  merge-gate:
    name: Merge gate
    runs-on: ubuntu-latest
    needs: [secret-scan, stable-checks]
    if: always()
    steps:
      - name: Check required results
        env:
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          STABLE_CHECKS_RESULT: ${{ needs.stable-checks.result }}
        run: |
          if [ "$SECRET_SCAN_RESULT" != "success" ] || [ "$STABLE_CHECKS_RESULT" != "success" ]; then
            echo "Required CI checks failed"
            exit 1
          fi
          echo "Required CI checks passed"
