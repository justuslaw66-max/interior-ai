name: Full E2E (informational)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA to test
        required: true
        type: string
  pull_request:
    branches: [main, develop, staging, integration/deep-clean-v1]
    types: [labeled]
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: full-advisory-${{ github.event.pull_request.number || github.event_name == 'schedule' && 'staging-nightly' || inputs.source_sha || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-full:
    name: Full E2E (informational)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'run-full-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: interior_ai_test
        options: >-
          --health-cmd "pg_isready -U test -d interior_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      CI: "true"
      CI_AUTH_FIXTURE_MODE: "1"
      CI_AUTH_FIXTURE_SESSION_ID: ${{ github.run_id }}-${{ github.run_attempt }}-full-advisory-auth-session
      CI_AUTH_FIXTURE_SESSION_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-full-advisory-auth-nonce
      CI_AUTH_FIXTURE_SESSION_CLASSIFICATION: PRODUCTION_INELIGIBLE_SYNTHETIC_AUTH
      APP_ENV: development
      DATABASE_URL: postgresql://test:test@localhost:5432/interior_ai_test
      AUTH_SECRET: ci-only-auth-secret-at-least-32-characters
      NEXTAUTH_SECRET: ci-only-auth-secret-at-least-32-characters
      NEXTAUTH_URL: http://127.0.0.1:3000
      APP_ORIGIN: http://127.0.0.1:3000
      AUTH_TRUST_HOST: "true"
      ADMIN_EMAILS: gate-a3-admin@example.test
      PLAYWRIGHT_ADMIN_EMAIL: gate-a3-admin@example.test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.source_sha || 'refs/heads/staging' }}
          lfs: true
          fetch-depth: 0

      - name: Verify full-advisory source identity
        id: verify-source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.source_sha || '' }}
        run: |
          set -euo pipefail
          actual_source_sha="$(git rev-parse HEAD)"
          if [[ ! "$actual_source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Checked-out full-advisory source SHA is malformed" >&2
            exit 1
          fi
          if [ -n "$EXPECTED_SOURCE_SHA" ] && [ "$actual_source_sha" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "Full-advisory checkout does not match the requested exact source" >&2
            exit 1
          fi
          echo "tested_source_sha=$actual_source_sha" >> "$GITHUB_OUTPUT"

      - name: Configure runner-local authentication fixture paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "CI_AUTH_FIXTURE_RESULT_ROOT=$RUNNER_TEMP/interior-ai-auth-results"
            echo "CI_AUTH_FIXTURE_SESSION_ROOT=$RUNNER_TEMP/interior-ai-auth-session-full-advisory"
          } >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure synthetic CI OAuth fixture
        env:
          CI_AUTH_FIXTURE_RESULT_PATH: ${{ runner.temp }}/interior-ai-auth-results/full-advisory-export.json
          CI_AUTH_FIXTURE_RESULT_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-full-advisory-export
          CI_AUTH_FIXTURE_EXPECTED_COMMAND_ID: ci:auth-fixture:export
          CI_AUTH_FIXTURE_EXPECTED_MODE: provider-fixture-export
        run: |
          mkdir -p "$CI_AUTH_FIXTURE_RESULT_ROOT"
          export CI_AUTH_FIXTURE_CANDIDATE_COMMIT_SHA="$(git rev-parse HEAD)"
          export CI_AUTH_FIXTURE_CANDIDATE_TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          set +e
          npm run ci:auth-fixture:export
          auth_command_status=$?
          set -e
          CI_AUTH_FIXTURE_ACTUAL_EXIT_STATUS="$auth_command_status" npm run ci:auth-fixture:result:validate
          if [ "$auth_command_status" -ne 0 ]; then
            exit "$auth_command_status"
          fi

      - name: Validate synthetic CI OAuth fixture
        env:
          CI_AUTH_FIXTURE_RESULT_PATH: ${{ runner.temp }}/interior-ai-auth-results/full-advisory-validate.json
          CI_AUTH_FIXTURE_RESULT_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-full-advisory-validate
          CI_AUTH_FIXTURE_EXPECTED_COMMAND_ID: ci:auth-fixture:validate-existing
          CI_AUTH_FIXTURE_EXPECTED_MODE: auth-environment-validation
        run: |
          export CI_AUTH_FIXTURE_CANDIDATE_COMMIT_SHA="$(git rev-parse HEAD)"
          export CI_AUTH_FIXTURE_CANDIDATE_TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          set +e
          npm run ci:auth-fixture:validate-existing
          auth_command_status=$?
          set -e
          CI_AUTH_FIXTURE_ACTUAL_EXIT_STATUS="$auth_command_status" npm run ci:auth-fixture:result:validate
          if [ "$auth_command_status" -ne 0 ]; then
            exit "$auth_command_status"
          fi

      - name: Validate production misuse against the exported fixture
        env:
          CI_AUTH_FIXTURE_RESULT_PATH: ${{ runner.temp }}/interior-ai-auth-results/full-advisory-production-misuse.json
          CI_AUTH_FIXTURE_RESULT_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-full-advisory-production-misuse
          CI_AUTH_FIXTURE_EXPECTED_COMMAND_ID: ci:auth-fixture:production-misuse-existing
          CI_AUTH_FIXTURE_EXPECTED_MODE: production-misuse-validation
        run: |
          export CI_AUTH_FIXTURE_CANDIDATE_COMMIT_SHA="$(git rev-parse HEAD)"
          export CI_AUTH_FIXTURE_CANDIDATE_TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          set +e
          npm run ci:auth-fixture:production-misuse-existing
          auth_command_status=$?
          set -e
          CI_AUTH_FIXTURE_ACTUAL_EXIT_STATUS="$auth_command_status" npm run ci:auth-fixture:result:validate
          if [ "$auth_command_status" -ne 0 ]; then
            exit "$auth_command_status"
          fi

      - name: Apply database migrations
        env:
          GATE_A3_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npm run gate:a3:db

      - name: Preflight advisory authentication environment
        env:
          CI_AUTH_FIXTURE_RESULT_PATH: ${{ runner.temp }}/interior-ai-auth-results/full-advisory-preflight.json
          CI_AUTH_FIXTURE_RESULT_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-full-advisory-preflight
          CI_AUTH_FIXTURE_EXPECTED_COMMAND_ID: ci:auth-fixture:preflight-existing
          CI_AUTH_FIXTURE_EXPECTED_MODE: auth-session-preflight
        run: |
          export CI_AUTH_FIXTURE_CANDIDATE_COMMIT_SHA="$(git rev-parse HEAD)"
          export CI_AUTH_FIXTURE_CANDIDATE_TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          set +e
          npm run ci:auth-fixture:preflight-existing
          auth_command_status=$?
          set -e
          CI_AUTH_FIXTURE_ACTUAL_EXIT_STATUS="$auth_command_status" npm run ci:auth-fixture:result:validate
          if [ "$auth_command_status" -ne 0 ]; then
            exit "$auth_command_status"
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run advisory full E2E inventory
        run: npm run test:e2e:advisory

      - name: Prepare portable advisory evidence
        if: always() && !cancelled()
        run: npm run evidence:required-tests:prepare-upload

      - name: Upload test results
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-results
          path: .local/required-test-upload/
          if-no-files-found: error
          retention-days: 30
