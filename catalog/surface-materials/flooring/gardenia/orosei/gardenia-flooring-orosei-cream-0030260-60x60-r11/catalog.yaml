  notes:
    - "Tile faces: the 9 single item pictures of item 0030225 (https://www.abkgroup.it/en/gardeniaariana/download-area/single-item-picture/orosei/cream/pf60030225-v102/), because ABK's 9 R11 pictures (on Plein Air's page) are 0030225's 9 Natural pictures, byte for byte. Downloaded signed in on 2026-10-09, stored at 0.6 px per mm; the originals are sharper, see gardenia-orosei-cream-faces.manifest.json. Each covers 1200x1200 mm; the renderer cuts tile-sized windows at true scale. ABK's 60x60 pictures are this colour's 120x120 graphic squeezed to 600 mm: drawn as 1200 mm they match the colour's 120x120 and 60x120 pictures (r 0.99 to 1.00), and drawn as 600 mm nothing (r 0.11 to 0.13). So they are declared as 1200x1200 mm faces; the renderer cuts true-scale 600x600 windows from them."
    - "Imported from ABK Group's Gardenia&Ariana pages with user-confirmed permission on 2026-10-13: ABK lists this outdoor size on its Plein Air pages, and Gardenia's RealityRemod configurator, which the July import read, doesn't have it."
    - "ABK item 0030260 (pf60030260) for floor use: 60X60 R11, download area page https://www.abkgroup.it/en/gardeniaariana/download-area/single-item-picture/plein-air/orosei-cream/pf60030260-v102/."
    - "Colour page https://www.abkgroup.it/en/gardeniaariana/floor-and-wall-tiles/plein-air/orosei-cream/60x60/: OROSEI CREAM 60X60, finish R11, thickness 20 mm, porcelain stoneware."
    - "Outdoor size: Plein Air is ABK's outdoor range, the 20 mm R11 (anti-slip) versions of its collections. Its sizes of collections the catalogue has are listed with their own collection, as R11 sizes on the colour's card, for floors only (J, 2026-10-13)."
    - "Look and colour family: as the colour's other sizes in the catalogue, so this size joins its card."
    - "Layouts: straight, brick and vertical brick, as the colour's other 60x60 entries."
    - "Plein Air collection page technology: Porcelain stoneware."
    - "Plein Air collection page description: The Plein Air collection transfers the material sensations of Gardenia&Ariana’s main ceramic tile collections to exterior spaces. The collection combines the high technical performance of extra-thick products with a sophisticated aesthetic inspired by the timeless appeal of stone and the natural warmth of wood. Available in a range of sizes and complemented by coordinated finishing elements, the Plein Air collection caters for all stylistic and design needs in outdoor spaces."
    - "Plein Air collection page sizes: 80x80, 60x120, 60x90, 60x60, 30x120; thickness 20 mm."
    - "ABK's pages did not expose package quantity, price, or seamless texture QA data."
