  notes:
    - "Tile faces: the 14 single item pictures of item 0006050 (https://www.abkgroup.it/en/gardeniaariana/download-area/single-item-picture/anima/grigio/pf60006050-v102/), because ABK's 28 R11 pictures (on Plein Air's page) are 0006050's 28 pictures (each face's lighter and darker copy), byte for byte. Lighter sRGB copies from the signed-in download of 2026-10-02, stored at 0.6 px per mm; the originals are sharper, see gardenia-anima-grigio-faces.manifest.json. Each covers one whole 600x1200 mm tile."
    - "Imported from ABK Group's Gardenia&Ariana pages with user-confirmed permission on 2026-10-13: ABK lists this outdoor size on its Plein Air pages, and Gardenia's RealityRemod configurator, which the July import read, doesn't have it."
    - "ABK item 0006356 (pf60006356) for floor use: 60X120 R11, download area page https://www.abkgroup.it/en/gardeniaariana/download-area/single-item-picture/plein-air/anima-grigio/pf60006356-v102/."
    - "Colour page https://www.abkgroup.it/en/gardeniaariana/floor-and-wall-tiles/plein-air/anima-grigio/60x120/: ANIMA GRIGIO 60X120, finish R11, thickness 20 mm, porcelain stoneware."
    - "Outdoor size: Plein Air is ABK's outdoor range, the 20 mm R11 (anti-slip) versions of its collections. Its sizes of collections the catalogue has are listed with their own collection, as R11 sizes on the colour's card, for floors only (J, 2026-10-13)."
    - "Look and colour family: as the colour's other sizes in the catalogue, so this size joins its card."
    - "Layouts: straight, brick and vertical brick, as the colour's other 60x120 entries."
    - "Plein Air collection page technology: Porcelain stoneware."
    - "Plein Air collection page description: The Plein Air collection transfers the material sensations of Gardenia&Ariana’s main ceramic tile collections to exterior spaces. The collection combines the high technical performance of extra-thick products with a sophisticated aesthetic inspired by the timeless appeal of stone and the natural warmth of wood. Available in a range of sizes and complemented by coordinated finishing elements, the Plein Air collection caters for all stylistic and design needs in outdoor spaces."
    - "Plein Air collection page sizes: 80x80, 60x120, 60x90, 60x60, 30x120; thickness 20 mm."
    - "ABK's pages did not expose price or seamless texture QA data; the packing is in ABK's Plein Air technical sheet (below)."
    - "Laying and uses: ABK's Plein Air catalogue (January 2026, read 2026-10-14) gives every Plein Air tile five ways to be laid (glued, the one for floors vehicles drive over; dry on grass, on gravel or on sand; raised on pedestals 25 to 270 mm high) and names its places: driveways and parking areas, stepping stones and lawn walkways, courtyards, raised terraces, planters, pool areas, steps, external showers and pool walkways."
    - "Packing (ABK's Plein Air technical sheet, read 2026-10-14): 60x120 rectified, real size 596x1194 mm, 1 tile and 0.72 m² per box, 45.3 kg/m², 32.6 kg per box, 30 boxes per pallet."
    - "Special pieces in this colour (ABK's Plein Air catalogue, read 2026-10-14): grille, corner grilles, bullnose, L element, L element grip, step edge, curve; lib/surface-material-plein-air-system.ts lists their sizes and item codes."
    - "Quote on request (J, 2026-10-15): no price yet; the entry is published with purchase mode quote_or_sample, and Request sample / quote opens ABK's Gardenia&Ariana contact form (https://www.abkgroup.it/en/gardeniaariana/contacts/), where private customers and professionals send an information request."
