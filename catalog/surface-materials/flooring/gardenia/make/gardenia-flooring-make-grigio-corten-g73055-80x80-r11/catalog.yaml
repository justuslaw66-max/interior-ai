  notes:
    - "Tile faces: 4 single item pictures from the ABK Group download area (https://www.abkgroup.it/en/gardeniaariana/download-area/single-item-picture/plein-air/make-grigio-corten/g0073055-v102/), downloaded signed in on 2026-10-13, stored at 0.6 px per mm; the originals are sharper, see gardenia-make-grigio-corten-faces.manifest.json. Each covers 1000x1000 mm. ABK's 80x80 R11 pictures are the colour's 80x80 Natural faces exported again, a little lighter (whole-picture matching, r 0.95 to 0.98, one to one), so they show the same 1000x1000 mm graphic squeezed to 800 mm: drawn as 1000 mm their crops are found in the colour's 100x100 and 60x120 pictures (r 0.66 to 0.97). So they are declared as 1000x1000 mm faces; the renderer cuts true-scale 800x800 windows from them."
    - "Imported from ABK Group's Gardenia&Ariana pages with user-confirmed permission on 2026-10-13: ABK lists this outdoor size on its Plein Air pages. Gardenia's RealityRemod configurator, which the July import read, lists it as the same visible variant as G0073025 (Make Grigio Corten 80x80), so the July import filed it under that entry; ABK's Plein Air page shows R11 pictures of its own, so it is listed here as an R11 size of its own."
    - "ABK item g73055 (g0073055) for floor use: 80X80 R11, download area page https://www.abkgroup.it/en/gardeniaariana/download-area/single-item-picture/plein-air/make-grigio-corten/g0073055-v102/."
    - "Colour page https://www.abkgroup.it/en/gardeniaariana/floor-and-wall-tiles/plein-air/make-grigio-corten/80x80/: MAKE GRIGIO CORTEN 80X80, finish R11, thickness 20 mm, porcelain stoneware."
    - "Outdoor size: Plein Air is ABK's outdoor range, the 20 mm R11 (anti-slip) versions of its collections. Its sizes of collections the catalogue has are listed with their own collection, as R11 sizes on the colour's card, for floors only (J, 2026-10-13)."
    - "Look and colour family: as the colour's other sizes in the catalogue, so this size joins its card."
    - "Layouts: straight and vertical brick, as the colour's other 80x80 entries."
    - "Plein Air collection page technology: Porcelain stoneware."
    - "Plein Air collection page description: The Plein Air collection transfers the material sensations of Gardenia&Ariana’s main ceramic tile collections to exterior spaces. The collection combines the high technical performance of extra-thick products with a sophisticated aesthetic inspired by the timeless appeal of stone and the natural warmth of wood. Available in a range of sizes and complemented by coordinated finishing elements, the Plein Air collection caters for all stylistic and design needs in outdoor spaces."
    - "Plein Air collection page sizes: 80x80, 60x120, 60x90, 60x60, 30x120; thickness 20 mm."
    - "ABK's pages did not expose price or seamless texture QA data; the packing is in ABK's Plein Air technical sheet (below)."
    - "Laying and uses: ABK's Plein Air catalogue (January 2026, read 2026-10-14) gives every Plein Air tile five ways to be laid (glued, the one for floors vehicles drive over; dry on grass, on gravel or on sand; raised on pedestals 25 to 270 mm high) and names its places: driveways and parking areas, stepping stones and lawn walkways, courtyards, raised terraces, planters, pool areas, steps, external showers and pool walkways."
    - "Packing (ABK's Plein Air technical sheet, read 2026-10-14): 80x80 rectified, real size 797.25x797.25 mm, 1 tile and 0.64 m² per box, 45.3 kg/m², 28.9 kg per box, 35 boxes per pallet."
    - "Special pieces in this colour (ABK's Plein Air catalogue, read 2026-10-14): grille, corner grilles, bullnose, L element, L element grip, step edge, curve; lib/surface-material-plein-air-system.ts lists their sizes and item codes."
