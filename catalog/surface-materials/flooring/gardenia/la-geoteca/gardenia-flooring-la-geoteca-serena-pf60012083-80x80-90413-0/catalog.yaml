  notes:
    - "Tile faces: the 9 single item pictures of item 0012077 (https://www.abkgroup.it/en/gardeniaariana/download-area/single-item-picture/la-geoteca/serena/pf60012077-v102/), because ABK's 9 R11 pictures (on Plein Air's page) are 0012077's Nat P.tech pictures, byte for byte. Downloaded signed in on 2026-10-09, stored at 0.6 px per mm; the originals are sharper, see gardenia-la-geoteca-serena-faces.manifest.json. Each covers 800x800 mm; the renderer cuts tile-sized windows at true scale."
    - Imported from Gardenia RealityRemod configurator with user-confirmed permission on 2026-07-04.
    - Gardenia tile item GARDENIA/PF60012083/0/90413 for floor use.
    - "Configurator format: 80x80; surface destination: PAVIMENTO."
    - "Configurator pattern IDs: pieno_01, pieno_05."
    - "Collection page technology: Porcelain slabs."
    - "Collection page thicknesses: 6, 8.5, 20 mm."
    - "Collection page sizes: 120x280, 120x120, 80x80, 60x120."
    - "Collection page color availability for Serena: Serena 6mm: 120x280 (48\"x110\") - 120x120 (48\"x48\") - 60x120 (24\"x48\") | 8,5mm: 80x80 (32\"x32\") | 20mm R11: 80x80 (32\"x32\") - 60x120 (24\"x48\")."
    - "Available configurator formats: PF60011726 120x120 Nat ENTRAMBE patterns pieno_01,pieno_05; PF60011735 60x120 Nat ENTRAMBE patterns pieno_01,pieno_05; PF60011718 120x280 Nat ENTRAMBE patterns pieno_01,pieno_05; PF60012077 80x80 Nat ENTRAMBE patterns pieno_01,pieno_05; PF60012083 80x80 PAVIMENTO patterns pieno_01,pieno_05."
    - The configurator API did not expose slip rating, package quantity, price, or seamless texture QA data.
    - "Outdoor size (J, 2026-10-13: follow what ABK says): ABK lists item 0012083 on its Plein Air pages, colour page https://www.abkgroup.it/en/gardeniaariana/floor-and-wall-tiles/plein-air/la-geoteca-serena/80x80/: LA GEOTECA SERENA 80X80, finish R11, thickness 20 mm, porcelain stoneware. The July configurator import had not named its finish; it is named and described as the outdoor sizes added on 13 Oct. The July import had given it 8.5 mm, the thickness the collection page lists for the indoor 80x80. Balcony is among its rooms."
    - "Laying and uses: ABK's Plein Air catalogue (January 2026, read 2026-10-14) gives every Plein Air tile five ways to be laid (glued, the one for floors vehicles drive over; dry on grass, on gravel or on sand; raised on pedestals 25 to 270 mm high) and names its places: driveways and parking areas, stepping stones and lawn walkways, courtyards, raised terraces, planters, pool areas, steps, external showers and pool walkways."
    - "Packing (ABK's Plein Air technical sheet, read 2026-10-14): 80x80 rectified, real size 797.25x797.25 mm, 1 tile and 0.64 m² per box, 45.3 kg/m², 28.9 kg per box, 35 boxes per pallet."
    - "Special pieces in this colour (ABK's Plein Air catalogue, read 2026-10-14): grille, corner grilles, bullnose, L element, L element grip, step edge, curve; lib/surface-material-plein-air-system.ts lists their sizes and item codes."
    - "Quote on request (J, 2026-10-15): no price yet; the entry is published with purchase mode quote_or_sample, and Request sample / quote opens ABK's Gardenia&Ariana contact form (https://www.abkgroup.it/en/gardeniaariana/contacts/), where private customers and professionals send an information request."
