  notes:
    - "Tile faces: 6 single item pictures from the ABK Group download area (https://www.abkgroup.it/en/gardeniaariana/download-area/single-item-picture/plein-air/travertine-honey-cross/pf60012106-v102/), downloaded signed in on 2026-10-13, stored at 0.6 px per mm; the originals are sharper, see gardenia-plein-air-travertine-honey-cross-faces.manifest.json. Each covers 800x800 mm. ABK's 80x80 pictures are lighter than the colour's 60x60 and 60x90 pictures (mean sRGB 203/189/170 against 190/173/153) and are used as supplied."
    - "Imported from ABK Group's Gardenia&Ariana pages with user-confirmed permission on 2026-10-13: Plein Air is not in Gardenia's RealityRemod configurator, which the July import read."
    - "ABK item 0012106 (pf60012106) for floor use: 80X80 R11, download area page https://www.abkgroup.it/en/gardeniaariana/download-area/single-item-picture/plein-air/travertine-honey-cross/pf60012106-v102/."
    - "Colour page https://www.abkgroup.it/en/gardeniaariana/floor-and-wall-tiles/plein-air/travertine-honey-cross/80x80/: finish R11, thickness 20 mm, porcelain stoneware."
    - "Floor only: Plein Air is ABK's outdoor range, the 20 mm R11 (anti-slip) versions of its collections; its entries are listed for floors only (J, 2026-10-13)."
    - "Layouts: straight, brick and vertical brick, as for similar Gardenia tiles (J, 2026-10-10)."
    - "Colour: ABK describes Travertine Honey Cross as beige (colour page pictures)."
    - "Look: ABK describes Travertine Honey Cross as a stone effect (the colour page's picture descriptions), so it is filed as stone."
    - "Collection page technology: Porcelain stoneware."
    - "Collection page description: The Plein Air collection transfers the material sensations of Gardenia&Ariana’s main ceramic tile collections to exterior spaces. The collection combines the high technical performance of extra-thick products with a sophisticated aesthetic inspired by the timeless appeal of stone and the natural warmth of wood. Available in a range of sizes and complemented by coordinated finishing elements, the Plein Air collection caters for all stylistic and design needs in outdoor spaces."
    - "Collection page thicknesses: 20 mm."
    - "Collection page sizes: 80x80, 60x120, 60x90, 60x60, 30x120."
    - "Slip rating and outdoor use: ABK's colour pages give every Plein Air format as R11 (anti-slip), 20 mm, and the collection page describes it for exterior spaces."
    - "ABK's pages did not expose price or seamless texture QA data; the packing is in ABK's Plein Air technical sheet (below)."
    - "Laying and uses: ABK's Plein Air catalogue (January 2026, read 2026-10-14) gives every Plein Air tile five ways to be laid (glued, the one for floors vehicles drive over; dry on grass, on gravel or on sand; raised on pedestals 25 to 270 mm high) and names its places: driveways and parking areas, stepping stones and lawn walkways, courtyards, raised terraces, planters, pool areas, steps, external showers and pool walkways."
    - "Packing (ABK's Plein Air technical sheet, read 2026-10-14): 80x80 rectified, real size 797.25x797.25 mm, 1 tile and 0.64 m² per box, 45.3 kg/m², 28.9 kg per box, 35 boxes per pallet."
    - "Special pieces in this colour (ABK's Plein Air catalogue, read 2026-10-14): grille, corner grilles, bullnose, L element, L element grip, step edge, curve; lib/surface-material-plein-air-system.ts lists their sizes and item codes."
    - "Quote on request (J, 2026-10-15): no price yet; the entry is published with purchase mode quote_or_sample, and Request sample / quote opens ABK's Gardenia&Ariana contact form (https://www.abkgroup.it/en/gardeniaariana/contacts/), where private customers and professionals send an information request."
