  notes:
    - "Tile faces: the 36 single item pictures of item 0017756 (https://www.abkgroup.it/en/gardeniaariana/download-area/single-item-picture/falaise/mint/pf60017756-v102/), because ABK's 10 R11 pictures (on Plein Air's page) are 10 of 0017756's 36 Natural pictures, byte for byte. Downloaded signed in on 2026-10-08, stored at 0.6 px per mm; the originals are sharper, see gardenia-falaise-mint-faces.manifest.json. Each covers 600x600 mm; the renderer cuts tile-sized windows at true scale."
    - Imported from Gardenia RealityRemod configurator with user-confirmed permission on 2026-07-04.
    - Gardenia tile item GARDENIA/0017768/0/196308 for floor use.
    - "Configurator format: 60x60; surface destination: PAVIMENTO."
    - "Configurator pattern IDs: pieno_01, pieno_02, pieno_05."
    - "Collection page technology: Fine porcelain stoneware."
    - "Collection page description: Falaise reinterprets slate with neutral tones and realistic details, offering a three-dimensional effect and soft tone-on-tone shades.."
    - "Collection page thicknesses: 6, 8.5, 20 mm."
    - "Collection page sizes: 120x280, 120x120, 80x80, 60x120, 60x60."
    - "Collection page color availability for Mint: Mint 8,5 mm NAT: 120x120 (48\"x48\"), 60x120 (24\"x48\"), 60x60 (24\"x24\"), 80x80 (32\"x32\") | 20 mm R11: 60x120 (24\"x48\"), 60x60 (24\"x24\")."
    - "Available configurator formats: 0017754 120x120 Nat ENTRAMBE patterns pieno_01,pieno_02,pieno_05; 0017755 60x120 Nat ENTRAMBE patterns pieno_01,pieno_02,pieno_05; 0017767 60x120 PAVIMENTO patterns pieno_01,pieno_02,pieno_05; 0017756 60x60 Nat ENTRAMBE patterns pieno_01,pieno_02,pieno_05; 0017768 60x60 PAVIMENTO patterns pieno_01,pieno_02,pieno_05; 0017758 80x80 Nat ENTRAMBE patterns pieno_01,pieno_02,pieno_05."
    - The configurator API did not expose slip rating, package quantity, price, or seamless texture QA data.
    - "Outdoor size (J, 2026-10-13: follow what ABK says): ABK lists item 0017768 on its Plein Air pages, colour page https://www.abkgroup.it/en/gardeniaariana/floor-and-wall-tiles/plein-air/falaise-mint/60x60/: FALAISE MINT 60X60, finish R11, thickness 20 mm, porcelain stoneware. The July configurator import had not named its finish; it is named and described as the outdoor sizes added on 13 Oct. Balcony is among its rooms."
    - "Laying and uses: ABK's Plein Air catalogue (January 2026, read 2026-10-14) gives every Plein Air tile five ways to be laid (glued, the one for floors vehicles drive over; dry on grass, on gravel or on sand; raised on pedestals 25 to 270 mm high) and names its places: driveways and parking areas, stepping stones and lawn walkways, courtyards, raised terraces, planters, pool areas, steps, external showers and pool walkways."
    - "Packing (ABK's Plein Air technical sheet, read 2026-10-14): 60x60 rectified, real size 596x596 mm, 2 tiles and 0.72 m² per box, 45.3 kg/m², 32.6 kg per box, 30 boxes per pallet."
    - "Special pieces in this colour (ABK's Plein Air catalogue, read 2026-10-14): grille, corner grilles, bullnose, L element, L element grip, step edge, curve; lib/surface-material-plein-air-system.ts lists their sizes and item codes."
    - "Quote on request (J, 2026-10-15): no price yet; the entry is published with purchase mode quote_or_sample, and Request sample / quote opens ABK's Gardenia&Ariana contact form (https://www.abkgroup.it/en/gardeniaariana/contacts/), where private customers and professionals send an information request."
