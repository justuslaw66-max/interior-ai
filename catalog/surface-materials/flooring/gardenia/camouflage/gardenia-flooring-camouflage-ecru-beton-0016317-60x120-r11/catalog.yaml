    - "Tile faces: the 12 single item pictures of item 0016237 (https://www.abkgroup.it/en/gardeniaariana/download-area/single-item-picture/camouflage/ecru-beton/pf60016237-v102/), because ABK's 12 R11 pictures (on Plein Air's page) are 0016237's 12 faces, byte for byte (its copies with no colour profile; the faces are drawn from the sRGB copies). Downloaded signed in on 2026-10-12, stored at 0.6 px per mm; the originals are sharper, see gardenia-camouflage-ecru-beton-faces.manifest.json. Each covers 600x1200 mm; the renderer cuts tile-sized windows at true scale. ABK's page lists each face twice, once tagged sRGB and once with no colour profile and slightly darker (the same picture, image matching r 0.98 to 1.00); each face is used once, from its sRGB copy."
    - "Imported from ABK Group's Gardenia&Ariana pages with user-confirmed permission on 2026-10-13: ABK lists this outdoor size on its Plein Air pages, and Gardenia's RealityRemod configurator, which the July import read, doesn't have it."
    - "ABK item 0016317 (pf60016317) for floor use: 60X120 R11, download area page https://www.abkgroup.it/en/gardeniaariana/download-area/single-item-picture/plein-air/camouflage-ecru/pf60016317-v102/."
    - "Colour page https://www.abkgroup.it/en/gardeniaariana/floor-and-wall-tiles/plein-air/camouflage-ecru/60x120/: CAMOUFLAGE ECRU 60X120, finish R11, thickness 20 mm, porcelain stoneware."
    - "Outdoor size: Plein Air is ABK's outdoor range, the 20 mm R11 (anti-slip) versions of its collections. Its sizes of collections the catalogue has are listed with their own collection, as R11 sizes on the colour's card, for floors only (J, 2026-10-13)."
    - "Look and colour family: as the colour's other sizes in the catalogue, so this size joins its card. ABK's Plein Air page names the colour Camouflage Ecru."
    - "Layouts: straight, brick and vertical brick, as the colour's other 60x120 entries."
    - "Plein Air collection page technology: Porcelain stoneware."
    - "Plein Air collection page description: The Plein Air collection transfers the material sensations of Gardenia&Ariana’s main ceramic tile collections to exterior spaces. The collection combines the high technical performance of extra-thick products with a sophisticated aesthetic inspired by the timeless appeal of stone and the natural warmth of wood. Available in a range of sizes and complemented by coordinated finishing elements, the Plein Air collection caters for all stylistic and design needs in outdoor spaces."
    - "Plein Air collection page sizes: 80x80, 60x120, 60x90, 60x60, 30x120; thickness 20 mm."
    - "ABK's pages did not expose package quantity, price, or seamless texture QA data."
