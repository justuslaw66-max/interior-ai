  notes:
    - "Tile faces: the 8 single item pictures of item 0012265 (https://www.abkgroup.it/en/gardeniaariana/download-area/single-item-picture/pietra-viva/aude-beige/pf60012265-v102/), because ABK's Plein Air page for Aude Beige 80x80 R11 shows no pictures; the 80x80 Nat P.tech pictures stand in, as ABK's R11 pictures are the Nat P.tech ones wherever Pietra Viva has both (J, 9 Oct 2026). Downloaded signed in on 2026-10-09, stored at 0.6 px per mm; the originals are sharper, see gardenia-pietra-viva-aude-beige-faces.manifest.json. Each covers 1200x1200 mm; the renderer cuts tile-sized windows at true scale. ABK's 80x80 pictures are this colour's 120x120 graphic squeezed to 800 mm: drawn as 1200 mm they match the colour's 120x120 and 60x120 pictures (r 1.00), and drawn as 800 mm nothing (r 0.10 to 0.12). So they are declared as 1200x1200 mm faces; the renderer cuts true-scale 800x800 windows from them."
    - "Imported from ABK Group's Gardenia&Ariana pages with user-confirmed permission on 2026-10-13: ABK lists this outdoor size on its Plein Air pages. Gardenia's RealityRemod configurator, which the July import read, showed it as one variant with the 8.5 mm Nat item 0012265, and the July import filed both as gardenia-flooring-pietra-viva-aude-beige-0012267-80x80-nat-90916-0; that entry now stands for 0012265, and this item has an entry of its own (J, 2026-10-13)."
    - "ABK item 0012267 (pf60012267) for floor use: 80X80 R11, download area page https://www.abkgroup.it/en/gardeniaariana/download-area/single-item-picture/plein-air/pietra-viva-aude-beige/pf60012267-v102/."
    - "Colour page https://www.abkgroup.it/en/gardeniaariana/floor-and-wall-tiles/plein-air/pietra-viva-aude-beige/80x80/: PIETRA VIVA AUDE BEIGE 80X80, finish R11, thickness 20 mm, porcelain stoneware."
    - "Outdoor size: Plein Air is ABK's outdoor range, the 20 mm R11 (anti-slip) versions of its collections. Its sizes of collections the catalogue has are listed with their own collection, as R11 sizes on the colour's card, for floors only (J, 2026-10-13)."
    - "Picture: ABK's download area shows no picture of this item, so it draws item 0012265's faces, the colour's 80x80 Nat P.tech faces (J, 9 Oct 2026)."
    - "Look and colour family: as the colour's other sizes in the catalogue, so this size joins its card."
    - "Layouts: straight and vertical brick, as the July entry it was split from."
    - "Plein Air collection page technology: Porcelain stoneware."
    - "Plein Air collection page description: The Plein Air collection transfers the material sensations of Gardenia&Ariana’s main ceramic tile collections to exterior spaces. The collection combines the high technical performance of extra-thick products with a sophisticated aesthetic inspired by the timeless appeal of stone and the natural warmth of wood. Available in a range of sizes and complemented by coordinated finishing elements, the Plein Air collection caters for all stylistic and design needs in outdoor spaces."
    - "Plein Air collection page sizes: 80x80, 60x120, 60x90, 60x60, 30x120; thickness 20 mm."
    - "ABK's pages did not expose package quantity, price, or seamless texture QA data."
