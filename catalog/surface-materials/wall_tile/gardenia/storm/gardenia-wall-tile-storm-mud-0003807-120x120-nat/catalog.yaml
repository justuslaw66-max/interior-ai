    - "ABK item 0003807 (pf60003807) for wall use: 120X120 Natural, download area page https://www.abkgroup.it/en/gardeniaariana/download-area/single-item-picture/storm/mud/pf60003807-v102/."
    - "Colour page https://www.abkgroup.it/en/gardeniaariana/floor-and-wall-tiles/storm/mud/120x120/: finish Natural, thickness 8,5 mm, porcelain stoneware."
    - "Floor and wall: ABK's pages don't say which sizes are for floors or walls; every size is listed for both (J, 2026-10-10)."
    - "Layouts: straight, brick and vertical brick, as for similar Gardenia tiles (J, 2026-10-10)."
    - "Colour: ABK describes Mud as black (colour page pictures)."
    - "Collection page technology: Full body colored porcelain - GL."
    - "Collection page description: The Storm collection reinterprets Pulpis stone, exploiting the contrasting vein effects and lightly textured surface to enhance its material look and feel. Storm comes in four colours: the darkest shade Mud (which faithfully reproduces the eponymous natural material), the more neutral tones Grey and Sand, and White. Available in a wide range of modular sizes based on a 120x120 cm format, it lends its distinctive personality to residential spaces and can be used in both interior and exterior applications thanks to the extra-thick 20 mm version with an R11 grip surface."
    - "Collection page thicknesses: 8.5 mm."
    - "Collection page sizes: 120x120, 80x80, 60x120, 60x60."
    - "ABK's pages did not expose slip rating, package quantity, price, or seamless texture QA data."
    - "ABK's technical sheet for Storm (STORM - Datasheet.pdf, read 2026-10-14): 8.5 mm; slip resistance R10 (DIN 51130), bare foot A+B (DIN 51097)."
    - "Quote on request (J, 2026-10-15): no price yet; the entry is published with purchase mode quote_or_sample, and Request sample / quote opens ABK's Gardenia&Ariana contact form (https://www.abkgroup.it/en/gardeniaariana/contacts/), where private customers and professionals send an information request."
