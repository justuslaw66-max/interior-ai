    - "Collection page description: Fashion is a balance of details that reveals the style inherent in every gesture. It’s a solution of shapes and suggestions that are greater than the sum of their parts. Fashion is attention to detail. On the catwalks the motto is: style begins with shoes. We think it begins one step below that. A collection of ceramics can describe you in a unique way: among all the possible combination of JustNature sizes, colors and textures you will find a style that is only your own."
